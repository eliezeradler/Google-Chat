name: Run Chat Copier Sync

on:
  workflow_dispatch: # מאפשר הרצה ידנית או דרך API/Cron חיצוני

concurrency:
  group: chat-copier-sync
  cancel-in-progress: false # ריצות חדשות ימתינו בתור ולא ידרסו ריצה פעילה

jobs:
  sync-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # מוארך קצת למקרה של עשרות הודעות
    permissions:
      contents: write # חובה כדי לשמור את קובץ הזיכרון
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # מבטיח משיכה של הענף המעודכן ביותר בכל תחילת ריצה

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Run Sync Script
        env:
          GCP_TOKEN: ${{ secrets.GCP_TOKEN }}
        run: |
          git pull origin main # מסנכרן את קובץ הזיכרון מהשרת רגע לפני הריצה
          python main.py

      - name: Save Memory File (Commit)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 1. מוסיפים את קובץ הזיכרון
          git add sync_data.json
          
          # 2. שומרים אותו מקומית. הוספנו '|| true' כדי שהסקריפט לא יקרוס אם אין שינויים בקובץ
          git commit -m "Update state and thread mapping" || true
          
          # 3. עכשיו כש"השולחן נקי", אפשר למשוך עדכונים מהשרת בבטחה
          git pull --rebase origin main
          
          # 4. ולבסוף לדחוף הכל חזרה ל-GitHub
          git push
